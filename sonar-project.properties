# Repo ini belum punya suite PHPUnit sendiri, jadi tidak ada clover yang bisa dibaca Sonar;
# tanpa ini setiap baris baru otomatis 0% dan gerbang new_coverage selalu merah.
# Utang: tambahkan suite + coverage-clover.xml, lalu hapus baris di bawah.
sonar.coverage.exclusions=**/*
